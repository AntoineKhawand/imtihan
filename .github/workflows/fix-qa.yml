name: Fix QA
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:fix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-qa-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
