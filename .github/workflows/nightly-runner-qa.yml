name: Nightly runner QA
on:
  pull_request:
    paths:
      - 'scripts/nightly-ops.ps1'
      - 'scripts/nightly-ops-prompt.md'
      - 'scripts/test-nightly-git.ps1'
      - '.github/workflows/nightly-runner-qa.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/nightly-ops.ps1'
      - 'scripts/nightly-ops-prompt.md'
      - 'scripts/test-nightly-git.ps1'
      - '.github/workflows/nightly-runner-qa.yml'
permissions:
  contents: read
jobs:
  powershell-arguments:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Git arguments without running overnight operations
        shell: powershell
        run: ./scripts/test-nightly-git.ps1
